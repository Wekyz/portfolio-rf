name: CI

# Le GITHUB_TOKEN héritait des permissions par défaut du dépôt. La CI ne fait
# que lire le code, construire et tester : elle n'a besoin de rien d'autre.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Audit hebdomadaire : une vulnérabilité publiée après la dernière fusion ne
  # se signalerait autrement qu'au prochain commit, qui peut être lointain.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (astro check)
        run: npm run check

      - name: Build (astro build, includes thumbs fetch)
        run: npm run build

      # Après le build : les tests de routes et de budget s'appuient sur dist/.
      - name: Test (unitaires, routes, budgets)
        run: npm test

  e2e:
    name: Parcours et accessibilité
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Chromium seul : le rendu ne dépend d'aucune API exotique, et installer
      # les trois moteurs triplerait la durée du job.
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Parcours (journeys.spec.mjs) et accessibilité axe-core (a11y.spec.mjs).
      - name: Run journeys + axe
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    # Volontairement non bloquant. L'audit reste utile - c'est lui qui a révélé
    # la faille du CMS - mais une vulnérabilité publiée dans une dépendance
    # transitive, sans rapport avec ce site, ne doit pas empêcher de livrer un
    # correctif urgent. On veut être prévenu, pas immobilisé.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: |
          npm audit --audit-level=high | tee audit.txt
          {
            echo '## Audit des dépendances'
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
