name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (astro check)
        run: npm run check

      - name: Test (smoke tests, /api/contact)
        run: npm test

      - name: Build (astro build, includes thumbs fetch)
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
