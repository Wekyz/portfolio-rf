name: CI

# Le GITHUB_TOKEN héritait des permissions par défaut du dépôt. La CI ne fait
# que lire le code, construire et tester : elle n'a besoin de rien d'autre.
permissions:
  contents: read

# Deux poussées rapprochées sur la même branche lançaient deux exécutions
# complètes en parallèle, alors que le résultat de la première n'intéresse plus
# personne. On annule la précédente.
#
# `github.ref` et non le SHA : c'est la branche qu'on veut dédoublonner. Le
# groupe inclut le nom du workflow pour ne pas interférer si un autre est
# ajouté plus tard.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Exécution hebdomadaire : audit complet (une vulnérabilité publiée après la
  # dernière fusion ne se signalerait autrement qu'au prochain commit), et les
  # contrôles trop lents ou trop dépendants de tiers pour chaque PR : Safari
  # (WebKit) et liens externes. `workflow_dispatch` permet de les lancer à la
  # main depuis l'onglet Actions.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Actions épinglées par SHA de commit, version en commentaire. Une étiquette
# (@v4) peut être déplacée par l'éditeur ou par quiconque compromet son
# dépôt, et le code désigné s'exécute alors avec les droits du workflow (cas
# tj-actions/changed-files, mars 2025). Un SHA ne bouge pas. Dependabot sait
# tenir cette forme à jour : il remplace le SHA et le commentaire ensemble.

jobs:
  quality:
    name: Lint, types, build, tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (astro check)
        run: npm run check

      - name: Build (astro build, includes thumbs fetch)
        run: npm run build

      # Le job e2e construisait de son côté : deux builds par exécution, donc
      # 62 appels à l'API oEmbed de Vimeo là où 31 suffisent. On partage le
      # résultat plutôt que de le refaire.
      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

      # HTML des pages générées (balises, attributs, repères d'accessibilité).
      # Les pages d'administration sont exclues (.htmlvalidateignore).
      - name: Validate HTML (html-validate)
        run: npm run validate:html

      # Après le build : les tests de routes, de budget, de liens internes et
      # de données structurées s'appuient sur dist/.
      - name: Test (unitaires, routes, budgets, liens, JSON-LD)
        run: npm test

  e2e:
    name: Parcours et accessibilité
    runs-on: ubuntu-latest
    # Enchaîné plutôt que parallèle : c'est ce qui permet de réutiliser le
    # build ci-dessus. Effet secondaire souhaitable - inutile d'ouvrir un
    # navigateur sur du code qui ne compile pas.
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # La version de Playwright détermine celle du navigateur : la clé de
      # cache doit en dépendre, sinon une montée de version servirait un
      # Chromium périmé.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Chromium seul à chaque PR. `--with-deps` réinstalle les bibliothèques
      # système, que le cache ne couvre pas.
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'

      - name: Install system dependencies only
        run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # Parcours (journeys.spec.mjs), commandes du showreel (showreel.spec.mjs)
      # et accessibilité axe-core (a11y.spec.mjs). `astro preview` sert dist/,
      # récupéré ci-dessus : aucun build ici.
      - name: Run journeys + showreel + axe
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-webkit:
    name: Parcours sur Safari iOS (hebdomadaire)
    runs-on: ubuntu-latest
    needs: quality
    # Les producteurs consultent beaucoup sur iPhone, et c'est Safari qui a
    # les comportements particuliers (iframe Vimeo, défilement, focus). Une
    # fois par semaine : à chaque PR, il doublerait la durée de la CI.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (webkit)
        run: npx playwright install --with-deps webkit

      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Run journeys + axe on iPhone 14
        run: npx playwright test --project=iphone
        env:
          E2E_WEBKIT: '1'

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-webkit
          path: playwright-report/
          retention-days: 7

  links:
    name: Liens externes (hebdomadaire)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Non bloquant : un site tiers en panne ou qui refuse les robots ne dit
    # rien de l'état du nôtre. Les liens internes, eux, sont vérifiés à chaque
    # PR par tests/links.test.mjs. Le résumé de l'exécution liste les liens
    # morts à corriger.
    continue-on-error: true

    steps:
      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # IMDb et LinkedIn refusent les robots (403/999) : leurs liens seraient
      # toujours signalés. Vimeo est déjà vérifié au build (fetch-thumbs).
      - name: Check external links (lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --scheme https --scheme http
            --exclude 'imdb\.com'
            --exclude 'linkedin\.com'
            --exclude 'vimeo\.com'
            --exclude 'vimeocdn\.com'
            --exclude 'roxane-foare\.com'
            --max-retries 2
            'dist/**/*.html'
          fail: true

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Bloquant, mais seulement pour ce qui s'exécute en production : les
      # fonctions de api/ (Upstash). Astro et la chaîne de build sont en
      # devDependencies, ils ne sont jamais servis. Avant, tout l'audit était
      # non bloquant et neuf alertes sont passées inaperçues des semaines.
      - name: Audit (production, bloquant)
        run: npm audit --omit=dev --audit-level=high

      # Tout l'arbre, dont les outils de build : signalé dans le résumé, sans
      # bloquer. Une faille dans un outil de build ne doit pas empêcher de
      # livrer un correctif urgent ; elle se traite à la montée suivante.
      - name: Audit (complet, informatif)
        if: always()
        continue-on-error: true
        run: |
          npm audit --audit-level=high | tee audit.txt
          {
            echo '## Audit des dépendances (arbre complet)'
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
