name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & audit (astro/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: astro/.nvmrc
          cache: npm
          cache-dependency-path: astro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (astro build, includes thumbs fetch)
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
