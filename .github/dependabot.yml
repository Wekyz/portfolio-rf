version: 2
updates:
  # Dépendances npm du site (racine du dépôt)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # Outils de build et de test, mineures et correctifs : une PR, fusionnée
      # automatiquement si la CI passe (.github/workflows/dependabot.yml).
      # Exclus : Astro (le site entier en dépend, une mineure peut changer la
      # sortie) et Sveltia CMS (sa balise script, son empreinte SRI et la CSP
      # de /admin/ sont à mettre à jour à la main, tests/cms-version.test.mjs
      # le vérifie). Ceux-là arrivent en PR séparées, relues à la main.
      dev-minor-and-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "astro"
          - "@astrojs/*"
          - "@sveltia/cms"
      # Dépendances exécutées en production (fonctions de api/ : Upstash) :
      # regroupées, mais relues à la main.
      prod-minor-and-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript 7 casse `astro check` : son compilateur natif n'expose pas
      # encore l'API programmatique dont dépend le vérificateur d'Astro, qui
      # refuse explicitement de démarrer au-delà de la 6.x. Vérifié le
      # 2026-08-06 en tentant la montée. À rouvrir quand Astro l'annoncera :
      # https://github.com/withastro/roadmap/discussions/1321
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  # Actions GitHub, épinglées par SHA dans les workflows : Dependabot remplace
  # le SHA et le commentaire de version ensemble. Une seule PR par semaine
  # pour toutes les actions (il y en avait cinq ouvertes à la fois), relue à
  # la main : une action s'exécute avec les droits du workflow.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"
