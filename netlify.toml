# ────────────────────────────────────────────────────────────────
#  Netlify configuration — roxane-foare.com (build Astro)
#  Le site est servi depuis le dossier `astro/` (build statique -> dist/).
#  L'ancien site HTML statique est conservé dans `archive/` (non déployé).
# ────────────────────────────────────────────────────────────────

[build]
  base      = "astro"
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# ── REDIRECTS ────────────────────────────────────────────────────

# Mailto server-side (l'adresse n'apparaît jamais dans le HTML/JS)
[[redirects]]
  from   = "/api/email"
  to     = "/.netlify/functions/email"
  status = 200

# Fallback : toute URL inconnue renvoie la home
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 404

# ── HEADERS GLOBAUX ──────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options         = "SAMEORIGIN"
    X-Content-Type-Options  = "nosniff"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is https://identity.netlify.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://*.vimeocdn.com https://*.vimeo.com https://i.vimeocdn.com; frame-src https://player.vimeo.com; connect-src 'self' https://*.vimeo.com https://api.vimeo.com https://fresnel.vimeo.com https://vimeo.com https://cloud.umami.is https://api-gateway.umami.dev https://*.netlify.com https://api.github.com;"

# ── CACHE — assets hashés générés par Astro (immutables) ─────────
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── CACHE — polices ──────────────────────────────────────────────
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── CACHE — favicon ──────────────────────────────────────────────
[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ── CACHE — thumbs et live ───────────────────────────────────────
[[headers]]
  for = "/thumbs/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/live/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# ── CACHE — videos.json (si servi statiquement) ──────────────────
[[headers]]
  for = "/videos.json"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=300"

# ── ADMIN — CSP élargie pour Decap CMS (unsafe-eval requis) ──────
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag  = "noindex, nofollow"
    Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://identity.netlify.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.vimeocdn.com https://*.vimeo.com https://i.vimeocdn.com; frame-src 'self'; connect-src 'self' https://*.netlify.com https://api.github.com;"
