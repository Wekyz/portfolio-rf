# Sveltia CMS - backend GitHub + OAuth (remplace Netlify Identity/git-gateway).
# base_url doit pointer vers ton relais OAuth (ex. worker sveltia-cms-auth).
backend:
  name: github
  repo: Wekyz/portfolio-rf
  branch: main
  base_url: https://sveltia-cms-auth.wekyz.workers.dev

locale: fr

# media_folder : où Decap COMMIT les fichiers (chemin repo)
# public_folder : URL publique servie par le site
# Aucun champ ci-dessous n'utilise de widget image/file (les miniatures
# viennent du CDN Vimeo, voir le champ `thumb`) : ces deux réglages ne
# servent qu'aux overrides manuels (ex. live/live1.webp), d'où le chemin
# vers public/live plutôt que l'ancien public/thumbs (supprimé).
media_folder: "public/live"
public_folder: "/live"

collections:
  - name: "videos"
    label: "Vidéos"
    label_singular: "Vidéo"
    description: "Liste des vidéos du portfolio - l'ordre ici est l'ordre d'affichage sur le site."
    files:
      - name: "videos"
        label: "Liste des vidéos"
        file: "src/data/videos.json"
        fields:
          - name: "videos"
            label: "Vidéos"
            label_singular: "Vidéo"
            widget: list
            summary: "{{fields.title}} - {{fields.cat}}"
            fields:

              - name: cat
                label: "Catégorie"
                widget: select
                options:
                  - { label: "Commercial",    value: "pub"    }
                  - { label: "Feature Film",  value: "film"   }
                  - { label: "Documentary",   value: "doc"    }
                  - { label: "Corporate",     value: "corpo"  }
                  - { label: "Event",         value: "event"  }
                  - { label: "Teaser",        value: "teaser" }
                  - { label: "Live",          value: "live"   }

              - name: title
                label: "Titre"
                widget: string

              - name: credit
                label: "Crédit / Production"
                widget: string
                required: false
                hint: "ex : Production : Atelier B  /  Director : Thomas Gérard"

              - name: year
                label: "Année"
                widget: string
                required: false
                hint: "ex : 2024  ou  2018-2022"

              - name: id
                label: "ID Vimeo"
                widget: string
                required: false
                hint: "Pour une vidéo Live : remplir CECI (et laisser Miniature vide) pour un Live en vidéo cliquable. Laisser vide si le Live est une simple photo (voir champ Miniature)."

              - name: hash
                label: "Hash Vimeo (vidéo privée)"
                widget: string
                required: false
                hint: "Uniquement pour les vidéos privées Vimeo"

              - name: thumb
                label: "Miniature (optionnel)"
                widget: string
                required: false
                hint: "Laisser VIDE si un ID Vimeo est renseigné : la miniature est récupérée automatiquement depuis Vimeo au build. Pour un Live en photo (sans vidéo), renseigner ici l'image (ex. live/live1.webp) et laisser ID Vimeo vide."

              - name: fullWidth
                label: "Pleine largeur"
                widget: boolean
                default: false
                required: false
                hint: "Affiche la vidéo sur toute la largeur (Feature Film)"

              - name: poster
                label: "Vignette affiche"
                widget: boolean
                default: false
                required: false
                hint: "Pour une image qui n'est ni au format 16/10 ni au format portrait (affiche, montage de plusieurs photogrammes) : la vignette est centrée sur une demi-largeur et l'image est montrée en entier, sans recadrage. Suppose une Miniature renseignée ci-dessus. Ne pas cocher en même temps que Pleine largeur."

              - name: description
                label: "Présentation du projet"
                widget: text
                required: false
                hint: "Trois à cinq phrases : le parti pris de montage, le format, les contraintes, votre rôle exact. Affiché sur la page du projet et repris par Google et les moteurs de réponse. Facultatif - à remplir en priorité pour les projets les plus représentatifs."

              - name: featured
                label: "Mettre en avant sur l'accueil"
                widget: boolean
                default: false
                required: false
                hint: "Les projets cochés apparaissent sur la page d'accueil, dans l'ordre de cette liste (3 maximum). Si aucun n'est coché, la page d'accueil n'affiche pas cette section du tout."

              - name: externalLink
                label: "Lien externe"
                widget: string
                required: false
                hint: "URL externe - affichée en bouton sur la page du projet"

              - name: slug
                label: "Identifiant d'URL"
                widget: string
                required: false
                pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Minuscules, chiffres et tirets uniquement"]
                hint: "Laisser vide : l'adresse est déduite du titre. À remplir uniquement pour figer une adresse déjà en ligne avant de renommer le projet."

              - name: noClick
                label: "Non cliquable"
                widget: boolean
                default: false
                required: false
                hint: "Force le clic désactivé même si un ID Vimeo est renseigné. Inutile pour un Live en photo simple (déjà non cliquable sans ID)."
