# Sveltia CMS - backend GitHub + OAuth (remplace Netlify Identity/git-gateway).
# base_url doit pointer vers ton relais OAuth (ex. worker sveltia-cms-auth).
backend:
  name: github
  repo: Wekyz/portfolio-rf
  branch: main
  base_url: https://sveltia-cms-auth.wekyz.workers.dev

locale: fr

# media_folder : où Decap COMMIT les fichiers (chemin repo)
# public_folder : URL publique servie par le site
# Aucun champ ci-dessous n'utilise de widget image/file (les miniatures
# viennent du CDN Vimeo, voir le champ `thumb`) : ces deux réglages ne
# servent qu'aux overrides manuels (ex. live/live1.webp), d'où le chemin
# vers public/live plutôt que l'ancien public/thumbs (supprimé).
media_folder: "public/live"
public_folder: "/live"

collections:
  - name: "videos"
    label: "Vidéos"
    label_singular: "Vidéo"
    description: "Liste des vidéos du portfolio - l'ordre ici est l'ordre d'affichage sur le site."
    files:
      - name: "videos"
        label: "Liste des vidéos"
        file: "src/data/videos.json"
        fields:
          - name: "videos"
            label: "Vidéos"
            label_singular: "Vidéo"
            widget: list
            summary: "{{fields.title}} - {{fields.cat}}"
            fields:

              - name: cat
                label: "Catégorie"
                widget: select
                options:
                  - { label: "Commercial",    value: "pub"    }
                  - { label: "Feature Film",  value: "film"   }
                  - { label: "Documentary",   value: "doc"    }
                  - { label: "Corporate",     value: "corpo"  }
                  - { label: "Event",         value: "event"  }
                  - { label: "Teaser",        value: "teaser" }
                  - { label: "Live",          value: "live"   }

              - name: title
                label: "Titre"
                widget: string

              - name: credit
                label: "Crédit / Production"
                widget: string
                required: false
                hint: "ex : Production : Atelier B  /  Director : Thomas Gérard"

              - name: year
                label: "Année"
                widget: string
                required: false
                hint: "ex : 2024  ou  2018-2022"

              - name: id
                label: "ID Vimeo"
                widget: string
                required: false
                hint: "Laisser vide pour les vidéos Live"

              - name: hash
                label: "Hash Vimeo (vidéo privée)"
                widget: string
                required: false
                hint: "Uniquement pour les vidéos privées Vimeo"

              - name: thumb
                label: "Miniature (optionnel)"
                widget: string
                required: false
                hint: "Laisser VIDE : la miniature est récupérée automatiquement depuis Vimeo au build. Ne remplir que pour forcer une image précise (ex. live/live1.webp ou une affiche)."

              - name: fullWidth
                label: "Pleine largeur"
                widget: boolean
                default: false
                required: false
                hint: "Affiche la vidéo sur toute la largeur (Feature Film)"

              - name: externalLink
                label: "Lien externe"
                widget: string
                required: false
                hint: "URL externe - remplace le lecteur Vimeo au clic"

              - name: noClick
                label: "Non cliquable"
                widget: boolean
                default: false
                required: false
                hint: "Désactive le clic (vidéos Live)"
