# Sveltia CMS - backend GitHub + OAuth (remplace Netlify Identity/git-gateway).
# base_url doit pointer vers ton relais OAuth (ex. worker sveltia-cms-auth).
backend:
  name: github
  repo: Wekyz/portfolio-rf
  branch: main
  base_url: https://sveltia-cms-auth.wekyz.workers.dev

# Pas d'option `locale` : Sveltia ne la prend pas en charge (avertissement
# en console depuis la 0.202) ; l'interface suit la langue du navigateur.

# media_folder : où le CMS COMMIT les fichiers déposés (chemin dans le dépôt)
# public_folder : préfixe inscrit dans les champs qui y font référence
# Aucun champ ci-dessous n'utilise de widget image/file (les miniatures
# viennent du CDN Vimeo, voir le champ `thumb`) : ces deux réglages ne
# servent qu'aux overrides manuels (ex. live/live1.webp). Les images vivent
# dans src/assets/live/ : astro:assets les décline au build, en WebP et en
# AVIF, sous des noms à empreinte (voir src/lib/images.js). Le champ garde la
# forme `live/<fichier>`, rien ne change dans la saisie.
media_folder: "src/assets/live"
public_folder: "/live"

collections:
  - name: "videos"
    label: "Vidéos"
    label_singular: "Vidéo"
    description: "Liste des vidéos du portfolio - l'ordre ici est l'ordre d'affichage sur le site."
    files:
      - name: "videos"
        label: "Liste des vidéos"
        file: "src/data/videos.json"
        fields:
          - name: "videos"
            label: "Vidéos"
            label_singular: "Vidéo"
            widget: list
            summary: "{{fields.title}} - {{fields.cat}}"
            fields:

              - name: cat
                label: "Catégorie"
                widget: select
                options:
                  - { label: "Commercial",    value: "pub"    }
                  - { label: "Feature Film",  value: "film"   }
                  - { label: "Documentary",   value: "doc"    }
                  - { label: "Corporate",     value: "corpo"  }
                  - { label: "Event",         value: "event"  }
                  - { label: "Teaser",        value: "teaser" }
                  - { label: "Live",          value: "live"   }

              - name: title
                label: "Titre"
                widget: string

              # Anciennement un champ unique "credit" qui mélangeait production,
              # réalisation, format et rôle : la fiche affichait
              # "Production : Episodes of 30 min". Un champ par information.
              - name: production
                label: "Société de production"
                widget: string
                required: false
                hint: "Le nom seul, ex : Atelier B. Le libellé « Production » est ajouté par le site, dans la bonne langue."

              - name: director
                label: "Réalisation"
                widget: string
                required: false
                hint: "Nom du réalisateur ou de la réalisatrice, ex : Thomas Gérard."

              - name: format
                label: "Format"
                widget: object
                required: false
                collapsed: true
                hint: "Pour une série ou un format particulier, ex : 5 épisodes de 14 min. À saisir dans les deux langues."
                fields:
                  - { name: fr, label: "Français", widget: string, required: false }
                  - { name: en, label: "Anglais", widget: string, required: false }

              - name: role
                label: "Poste (si autre que le montage)"
                widget: string
                required: false
                hint: "Pour les lives surtout, tel qu'au générique, ex : LSM Operator. Laisser vide pour un montage."

              - name: year
                label: "Année"
                widget: string
                required: false
                # Sveltia teste le motif même sur un champ vide : le groupe
                # facultatif `(...)?` laisse passer la valeur vide.
                pattern: ['^(\d{4}(-\d{4})?)?$', "Une année (2024) ou une période (2018-2022)"]
                hint: "ex : 2024  ou  2018-2022. Laisser vide si l'année n'est pas sûre : elle s'affiche sur la grille, la fiche et dans les données lues par Google."

              - name: id
                label: "ID Vimeo"
                widget: string
                required: false
                hint: "Pour une vidéo Live : remplir CECI (et laisser Miniature vide) pour un Live en vidéo cliquable. Laisser vide si le Live est une simple photo (voir champ Miniature)."

              - name: hash
                label: "Hash Vimeo (vidéo privée)"
                widget: string
                required: false
                hint: "Uniquement pour les vidéos privées Vimeo"

              - name: thumb
                label: "Miniature (optionnel)"
                widget: string
                required: false
                hint: "Laisser VIDE si un ID Vimeo est renseigné : la miniature est récupérée automatiquement depuis Vimeo au build. Pour un Live en photo (sans vidéo) ou une affiche, déposer l'image dans la médiathèque (icône image en haut), puis écrire ici live/ suivi du nom du fichier (ex. live/live1.webp). WebP, JPEG ou PNG."

              - name: fullWidth
                label: "Pleine largeur"
                widget: boolean
                default: false
                required: false
                hint: "Affiche la vidéo sur toute la largeur (Feature Film)"

              - name: poster
                label: "Vignette affiche"
                widget: boolean
                default: false
                required: false
                hint: "Pour une image qui n'est ni au format 16/10 ni au format portrait (affiche, montage de plusieurs photogrammes) : la vignette est centrée sur une demi-largeur et l'image est montrée en entier, sans recadrage. Suppose une Miniature renseignée ci-dessus. Ne pas cocher en même temps que Pleine largeur."

              - name: portrait
                label: "Vignette portrait"
                widget: boolean
                default: false
                required: false
                hint: "Vignette verticale (format 2/3) sur un tiers de largeur, pour une image tournée en portrait. Ne pas cocher en même temps que Pleine largeur ou Vignette affiche."

              - name: awards
                label: "Distinctions"
                widget: list
                required: false
                field: { name: award, label: "Distinction", widget: string }
                hint: "Prix ou sélection, un par ligne. Ex. : Best Editing Award - Cyprus International Film Festival. Affiché sur la page du projet et déclaré aux moteurs de recherche. Laisser vide s'il n'y en a pas, et surtout ne pas les écrire dans le champ Crédit."

              - name: description
                label: "Présentation du projet"
                widget: text
                required: false
                hint: "Trois à cinq phrases, soit 300 à 800 caractères environ : le parti pris de montage, le format, les contraintes, votre rôle exact. Affiché sur la page du projet et repris par Google et les moteurs de réponse. Facultatif - à remplir en priorité pour les projets les plus représentatifs."

              - name: featured
                label: "Mettre en avant sur l'accueil"
                widget: boolean
                default: false
                required: false
                hint: "Les projets cochés apparaissent sur la page d'accueil, dans l'ordre de cette liste (3 maximum). Si aucun n'est coché, la page d'accueil n'affiche pas cette section du tout."

              - name: externalLink
                label: "Lien externe"
                widget: string
                required: false
                hint: "URL externe - affichée en bouton sur la page du projet"

              - name: slug
                label: "Identifiant d'URL"
                widget: string
                required: false
                # Même remarque que pour `year` : vide autorisé par le `?` final.
                pattern: ["^([a-z0-9]+(-[a-z0-9]+)*)?$", "Minuscules, chiffres et tirets uniquement"]
                hint: "Laisser vide : l'adresse est déduite du titre. À remplir uniquement pour figer une adresse déjà en ligne avant de renommer le projet."

              - name: noClick
                label: "Non cliquable"
                widget: boolean
                default: false
                required: false
                hint: "Force le clic désactivé même si un ID Vimeo est renseigné. Inutile pour un Live en photo simple (déjà non cliquable sans ID)."

  # Sélections privées (AME-05) : une page /review/<identifiant> par entrée,
  # non indexée et absente du sitemap, pour envoyer à une production une
  # sélection de projets avec un mot d'accompagnement. L'identifiant est
  # généré au hasard : seule une personne qui a reçu le lien trouve la page.
  - name: "reviews"
    label: "Sélections privées"
    label_singular: "Sélection privée"
    description: "Pages de visionnage à envoyer à une production. Chacune a une adresse secrète (roxane-foare.com/review/...) que les moteurs de recherche n'indexent pas. Supprimer une sélection retire sa page au déploiement suivant."
    files:
      - name: "reviews"
        label: "Liste des sélections"
        file: "src/data/reviews.json"
        fields:
          - name: "reviews"
            label: "Sélections"
            label_singular: "Sélection"
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - name: id
                label: "Identifiant de la page"
                widget: uuid
                hint: "Généré automatiquement. L'adresse à envoyer est roxane-foare.com/review/ suivi de cet identifiant."

              - name: title
                label: "Titre"
                widget: string
                hint: "Affiché en haut de la page, ex : Sélection pour Atelier B, documentaire."

              - name: lang
                label: "Langue de la page"
                widget: select
                default: "fr"
                options:
                  - { label: "Français", value: "fr" }
                  - { label: "Anglais", value: "en" }

              - name: intro
                label: "Mot d'accompagnement"
                widget: text
                required: false
                hint: "Quelques phrases pour la production. Une ligne vide sépare deux paragraphes."

              - name: projects
                label: "Projets"
                widget: relation
                collection: videos
                file: videos
                value_field: "videos.*.title"
                search_fields: ["videos.*.title"]
                display_fields: ["videos.*.title"]
                multiple: true
                hint: "Dans l'ordre d'affichage. Seuls les projets avec une vidéo Vimeo sont montrés."

              - name: expires
                label: "Date de fin (facultatif)"
                widget: datetime
                required: false
                date_format: "DD/MM/YYYY"
                time_format: false
                picker_utc: true
                hint: "Après cette date, la page n'est plus générée (au déploiement suivant)."
