<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Redéployer le site - Roxane Foare</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0e0e0c; color: #fafaf8;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 420px; width: 100%;
      background: #1a1a17; border: 1px solid #2e2e29; border-radius: 12px;
      padding: 32px; text-align: center;
    }
    h1 { font-size: 18px; font-weight: 600; margin: 0 0 12px; }
    p { font-size: 14px; color: #a8a89f; line-height: 1.6; margin: 0 0 24px; }
    button {
      width: 100%; padding: 14px 20px; border-radius: 8px; border: none;
      background: #fafaf8; color: #0e0e0c; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity .2s;
    }
    button:hover { opacity: .85; }
    button:disabled { opacity: .5; cursor: progress; }
    #status { margin-top: 16px; font-size: 13px; min-height: 18px; }
    #status.ok { color: #7fbf7f; }
    #status.err { color: #e08080; }
    a.back { display: inline-block; margin-top: 24px; font-size: 12px; color: #6e6e68; text-decoration: none; }
    a.back:hover { color: #a8a89f; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Redéployer le site</h1>
    <p>
      À utiliser uniquement si tu as changé quelque chose <strong>directement sur
      Vimeo</strong> (ex. miniature) sans passer par le CMS - un enregistrement dans
      le CMS relance déjà le site automatiquement, pas besoin de ce bouton dans ce cas.
    </p>
    <button id="btn" type="button">Lancer un redéploiement</button>
    <p id="status" role="status" aria-live="polite"></p>
    <a class="back" href="/admin/">&larr; Retour au CMS</a>
  </div>

  <script>
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');
    btn.addEventListener('click', () => {
      btn.disabled = true;
      status.className = '';
      status.textContent = 'Déclenchement en cours…';
      fetch('/api/redeploy', { method: 'POST' })
        .then((res) => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          status.className = 'ok';
          status.textContent = 'C\'est parti - le nouveau build prend quelques minutes.';
        })
        .catch(() => {
          status.className = 'err';
          status.textContent = 'Échec du déclenchement, réessaie dans un instant.';
        })
        .finally(() => {
          setTimeout(() => { btn.disabled = false; }, 15000);
        });
    });
  </script>
</body>
</html>
